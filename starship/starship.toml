"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

# <user> in <directory> <devshell> <git branch>
# ❯
format = """
$username\
$directory\
$nix_shell\
$git_branch\
$git_commit\
$git_state\
$git_status\
$line_break\
$character"""

[username]
format = "[$user]($style) in "
show_always = true
style_root = "bold red"
style_user = "bold green"

[directory]
# Full path like bash's \w: ~ for home, no truncation.
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 0
truncate_to_repo = false

[nix_shell]
# Shown inside `nix develop` / `dev` / direnv devshells.
format = "[$symbol$name]($style) "
symbol = "❄️ "

[git_branch]
format = "[$symbol$branch]($style) "
always_show_remote = false

[git_status]
# Show how many commits ahead/behind the remote, e.g. ⇡2 ⇣1
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

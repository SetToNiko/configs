# Desktop-only i3 settings. Linked to ~/.config/host/i3.conf by home-manager
# and included from i3/config.

font pango:JetBrainsMono Nerd Font 9

# Dual monitor layout; the "docked" profile is defined in
# dotfiles-nixos/hosts/desktop/home.nix (programs.autorandr)
exec --no-startup-id autorandr --load docked

# Neo-tree style keys for the nvim yazi sidebar (<leader>t)
[mgr]
prepend_keymap = [
  { on = "h", run = "hidden toggle", desc = "Toggle hidden files" },
  { on = ".", run = "enter", desc = "Enter the hovered directory" },
  { on = "<Backspace>", run = "leave", desc = "Go to the parent directory" },
  { on = "<Enter>", run = "plugin smart-enter", desc = "Open file / enter directory" },
  { on = "<Esc>", run = "quit", desc = "Close the sidebar" },
]

# Laptop-only i3 settings. Linked to ~/.config/host/i3.conf by home-manager
# and included from i3/config.

font pango:JetBrainsMono Nerd Font 12

# using brightnessctl to control screen brightness
set $refresh_brightness pkill -RTMIN+11 i3blocks
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl -d intel_backlight set 10%+ && $refresh_brightness
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl -d intel_backlight --min-value=0 set 10%- && $refresh_brightness
